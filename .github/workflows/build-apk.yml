name: Build Kelmo Scan APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/KelmoScan-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/KelmoScan-arm32.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KelmoScan-APK
          path: out/*.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kelmo Scan v1.0.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            Kelmo Scan — document scanner (camera scan, crop, filters, English + Urdu OCR, PDF, PIN/fingerprint lock).
            Most phones: download **KelmoScan-arm64.apk**. Old/cheap phones: **KelmoScan-arm32.apk**.
