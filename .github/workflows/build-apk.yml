name: Build Kelmo Scan APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (same version as the original machine)
        run: |
          REV=$(grep -m1 'revision:' .metadata | sed 's/.*"\(.*\)".*/\1/')
          echo "Flutter revision: $REV"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$HOME/flutter"
          git -C "$HOME/flutter" checkout -q "$REV"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kelmo-release.jks"
            echo "KELMO_KEYSTORE=$RUNNER_TEMP/kelmo-release.jks" >> "$GITHUB_ENV"
            echo "Using the fixed Kelmo release key"
          else
            echo "::warning::KEYSTORE_B64 secret missing - building with a temporary debug key"
          fi

      - name: Build APK
        env:
          KELMO_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=BUILD_RUN=${{ github.run_number }}

      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/KelmoScan-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/KelmoScan-arm32.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KelmoScan-APK
          path: out/*.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kelmo Scan v1.0.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            Kelmo Scan — document scanner (camera scan, crop, filters, English + Urdu OCR, PDF, PIN/fingerprint lock).
            Most phones: download **KelmoScan-arm64.apk**. Old/cheap phones: **KelmoScan-arm32.apk**.
