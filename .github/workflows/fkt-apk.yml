name: Build Kepler Messenger

on:
  push:
    paths:
      - 'fkt/**'
      - '.github/workflows/fkt-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fkt/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        run: |
          REV=$(grep -m1 'revision:' .metadata | sed 's/.*"\(.*\)".*/\1/')
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$HOME/flutter"
          git -C "$HOME/flutter" checkout -q "$REV"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        run: |
          flutter --version
          flutter create --org com.kepler --project-name kepler_messenger --platforms android .
          rm -rf test
          python3 tools/patch_android.py

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kelmo-release.jks"
            echo "KELMO_KEYSTORE=$RUNNER_TEMP/kelmo-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KELMO_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=BUILD_RUN=${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/out/Kepler-Messenger-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/out/Kepler-Messenger-arm32.apk"
          cd ../server && zip -r "$GITHUB_WORKSPACE/out/kepler-messenger-server.zip" server.js admin.html README.md

      - name: Publish (not marked latest, so Kelmo Scan updates are not affected)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fkt-v1.0.${{ github.run_number }}
          name: Kepler Messenger 1.0.${{ github.run_number }}
          make_latest: false
          files: out/*
